[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cinematic-mood-weaver"
version = "0.1.0"
description = "AI-driven multi-sensory entertainment orchestration system that reads real-time emotional state via voice and biometrics, then curates synchronized movie + music + lighting + aromatherapy mashup bundles."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["emotion-recognition", "affective-computing", "recommendation-system", "smart-home", "speech-emotion-recognition"]

dependencies = [
    "torch==2.3.0",
    "transformers==4.41.0",
    "sounddevice==0.4.7",
    "librosa==0.10.2",
    "spotipy==2.23.0",
    "anthropic==0.28.0",
    "openai==1.30.0",
    "sqlalchemy==2.0.30",
    "cryptography==42.0.8",
    "phue==1.1",
    "aiohttp==3.9.5",
    "pydantic-settings==2.3.0",
    "pydantic==2.7.0",
    "APScheduler==3.10.4",
    "bleak==0.21.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.4.0",
    "pre-commit>=3.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
strict = true
python_version = "3.11"
ignore_missing_imports = true

[project.scripts]
cinematic-mood-weaver = "cinematic_mood_weaver.main:main"
cmw-setup = "scripts.setup_env:main"
cmw-download-models = "scripts.download_models:main"
cmw-benchmark = "scripts.benchmark_models:main"
cmw-credentials = "scripts.credentials_setup:main"
cmw-smoke-test = "scripts.smoke_test:main"
cmw-health = "scripts.verify_health:main"
