name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov mypy ruff

      - name: Lint with ruff
        run: ruff check src/ scripts/

      - name: Type check with mypy
        run: mypy src/ --ignore-missing-imports || true

      - name: Run unit tests
        run: pytest tests/test_units/ -v --cov=src --cov-report=term --cov-report=xml

      - name: Run integration tests
        run: pytest tests/test_integration/ -v --cov=src --cov-append --cov-report=term

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install dependencies
        run: npm ci || npm install

      - name: TypeScript type check
        run: npx tsc --noEmit || true
